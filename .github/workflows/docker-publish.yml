name: Docker (GHCR)

# Builds the site image and pushes it to the GitHub Container Registry, so the
# CipherMesh hub can serve it from the same domain as the relay.
# Uses the built-in GITHUB_TOKEN — no extra secret needed.
on:
  push:
    branches: [master]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Build and publish image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The default buildx driver is `docker`, which cannot export a cache.
      # Without this step the build fails outright once cache-to is set.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    # Only after the image is actually in GHCR — otherwise the server would pull
    # a tag that does not exist yet and keep serving the old page silently.
    needs: docker
    # Opt-in, so the image still publishes cleanly before the hub is set up to
    # serve it. Turn it on with the repository variable DEPLOY_SITE_ENABLED=true
    # once deploy-site.sh and the SSH secrets are in place.
    if: ${{ vars.DEPLOY_SITE_ENABLED == 'true' }}
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
